---
# ============================================================
# Ansible Collection Requirements
# Install with: ansible-galaxy collection install -r requirements.yml
#
# cisco.ios         — ios_command module for all show tasks
# ansible.netcommon — network_cli connection plugin
# ansible.utils     — cli_parse with TextFSM engine
# ============================================================
collections:
  - name: cisco.ios
    version: ">=8.0.0"

  - name: cisco.asa
    version: ">=6.1.0"
    
  - name: ansible.netcommon
    version: ">=6.0.0"

  - name: ansible.utils
    version: ">=4.0.0"
