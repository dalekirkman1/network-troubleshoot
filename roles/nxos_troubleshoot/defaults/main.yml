---
# ============================================================
# ROLE DEFAULTS
# Lowest-precedence variables — safely overridden by:
# group_vars > host_vars > extra-vars (-e)
# These defaults are used if the variable is not defined
# in group_vars, host_vars, or passed via -e at runtime.
# ============================================================

# Line count controls
cpu_lines_to_show: 5    # Top N CPU processes shown in report
mem_lines_to_show: 5    # Top N memory processes shown in report
log_lines_terminal: 20  # Lines printed to terminal
log_lines_report: 15    # Lines written into the text report

# Alert thresholds
standard_mtu: "1500"    # MTU value considered normal
ospf_full_state: "FULL" # OSPF adjacency state string for healthy check

# Report output
report_dir: "./reports/"