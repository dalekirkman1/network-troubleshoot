---
# ============================================================
# SECTION 12: RECENT LOGS
#
# WHY: 'show logging' provides the event history that explains
#      interface changes, auth failures, failover transitions,
#      ACL denies, and system warnings. A truncated log section
#      gives fast operational context without flooding the report.
#
# HOW:
#   - Runs 'show logging'.
#   - The raw stdout string is processed in Jinja2:
#       1. '.splitlines()' converts output into a list.
#       2. '| map('trim')' strips whitespace padding.
#       3. '| reject('equalto', '')' removes blank lines.
#       4. '| list' materialises the generator for slicing.
#       5. A slice '[0:50]' keeps the report concise.
#       6. '| join('\n')' prints a readable log excerpt.
#
# Tags: logs — run alone with: --tags logs
# ============================================================

- name: "12. Recent logs"
  cisco.asa.asa_command:
    commands:
      - show logging
  register: asa_logs

- name: "DEBUG | Recent logs (first 50 lines)"
  ansible.builtin.debug:
    msg: >-
      {{ (asa_logs.stdout[0] | default('show logging: no output returned') | regex_replace('\r', ''))
         .splitlines() | map('trim') | reject('equalto', '') | list | slice(0, 50) | list | join('\n') }}

- name: "SET | Recent logs text"
  ansible.builtin.set_fact:
    asa_logs_text: >-
      {{ (asa_logs.stdout[0] | default('show logging: no output returned') | regex_replace('\r', ''))
         .splitlines() | map('trim') | reject('equalto', '') | list | slice(0, 50) | list | join('\n') }}