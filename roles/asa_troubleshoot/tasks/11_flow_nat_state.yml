---
- name: "11. Flow, NAT, and connection state"
  cisco.asa.asa_command:
    commands:
      - show conn count
      - show xlate count
      - show local-host
      - show nat detail
  register: asa_flow_state

- name: "DEBUG | Flow / NAT state raw"
  ansible.builtin.debug:
    var: asa_flow_state.stdout

- name: "SET | Flow / NAT summary strings"
  ansible.builtin.set_fact:
    asa_conn_count: "{{ asa_flow_state.stdout[0] | default('N/A') | regex_replace('\\r', '') }}"
    asa_xlate_count: "{{ asa_flow_state.stdout[1] | default('N/A') | regex_replace('\\r', '') }}"
    asa_local_host_summary: "{{ asa_flow_state.stdout[2] | default('N/A') | regex_replace('\\r', '') }}"
    asa_nat_detail: "{{ asa_flow_state.stdout[3] | default('N/A') | regex_replace('\\r', '') }}"