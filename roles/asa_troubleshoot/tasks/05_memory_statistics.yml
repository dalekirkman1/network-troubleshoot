---
# ============================================================
# SECTION 5: MEMORY STATISTICS
#
# WHY: Memory pressure on ASA can present as slow response,
#      process instability, or failover issues. This section
#      captures global memory usage and the top consumers.
#
# HOW:
#   - Runs:
#       * 'show memory'
#       * 'show processes memory sorted'
#   - The raw stdout strings are processed in Jinja2:
#       1. '.splitlines()' converts output into lists.
#       2. '| map('trim')' removes excess whitespace.
#       3. '| reject('equalto', '')' removes empty lines.
#       4. '| list' materialises the filtered output.
#       5. A slice keeps the first 20 lines of the sorted table
#          so the report remains readable.
#
# Tags: health, memory — run alone with: --tags health,memory
# ============================================================

- name: "5. Memory statistics"
  cisco.asa.asa_command:
    commands:
      - show memory
      - show processes memory sorted
  register: asa_memory_stats

- name: "DEBUG | Memory statistics raw"
  ansible.builtin.debug:
    var: asa_memory_stats.stdout

- name: "SET | Memory summary strings"
  ansible.builtin.set_fact:
    asa_memory_summary: >-
      {{ (asa_memory_stats.stdout[0] | default('show memory: no output returned') | regex_replace('\r', ''))
         .splitlines() | map('trim') | reject('equalto', '') | list | join('\n') }}
    asa_memory_top_str: >-
      {{ (asa_memory_stats.stdout[1] | default('show processes memory sorted: no output returned') | regex_replace('\r', ''))
         .splitlines() | map('trim') | reject('equalto', '') | list | slice(0, 20) | list | join('\n') }}