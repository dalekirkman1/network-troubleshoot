---
# ============================================================
# SECTION 8: TRANSCEIVER / INTERFACE DIAGNOSTICS
#
# WHY: ASA generally does not expose optics detail the way
#      switches/routers do, so the closest equivalent is full
#      interface diagnostics. This section provides a compact
#      snapshot of interface-level detail useful for media or
#      physical-link troubleshooting.
#
# HOW:
#   - Runs 'show interface'.
#   - The raw stdout string is processed entirely in Jinja2:
#       1. '.splitlines()' converts output to a list.
#       2. '| map('trim')' strips whitespace padding.
#       3. '| reject('equalto', '')' removes blank lines.
#       4. '| list' materialises the filtered output.
#       5. A slice '[0:50]' keeps the section short enough to
#          act as a transceiver-equivalent summary.
#       6. '| join('\n')' makes the report readable.
#
# Tags: health, interfaces — run alone with: --tags health,interfaces
# ============================================================

- name: "8. Transceiver / interface diagnostics"
  cisco.asa.asa_command:
    commands:
      - show interface
  register: asa_transceiver

- name: "DEBUG | Transceiver / interface raw"
  ansible.builtin.debug:
    var: asa_transceiver.stdout

- name: "SET | Transceiver-equivalent summary (first 50 lines)"
  ansible.builtin.set_fact:
    asa_transceiver_str: >-
      {{ (asa_transceiver.stdout[0] | default('show interface: no output returned') | regex_replace('\r', ''))
         .splitlines() | map('trim') | reject('equalto', '') | list | slice(0, 50) | list | join('\n') }}