---
- name: "8. Transceiver / interface diagnostics"
  cisco.asa.asa_command:
    commands:
      - show interface
  register: asa_transceiver

- name: "DEBUG | Transceiver / interface raw"
  ansible.builtin.debug:
    var: asa_transceiver.stdout

- name: "SET | Transceiver-equivalent summary (first 50 lines)"
  ansible.builtin.set_fact:
    asa_transceiver_str: >-
      {{ (asa_transceiver.stdout[0] | regex_replace('\\r', '')).split('\n')[0:50] | join('\n') }}