---
# ============================================================
# SECTION 10: ROUTING STATE
#
# WHY: Routing convergence and neighbor health are at the core
#      of IOS XR troubleshooting. Route table size, OSPF
#      adjacency, and BGP session state quickly reveal whether
#      control-plane protocols are healthy.
#
# HOW:
#   - Runs:
#       * 'show route summary' for RIB size/status.
#       * 'show ospf neighbor' for IGP adjacency state.
#       * 'show bgp summary' for BGP session status.
#   - Each block is passed through:
#       1. '.splitlines()' for line-by-line processing.
#       2. '| map(''trim'') | reject(''equalto'', '''')' to
#          clean padding/blank lines.
#       3. '| join('\n')' to embed concise routing tables in
#          the final report.
#
# Tags: routing — run alone with: --tags routing
# ============================================================

- name: "10. Routing protocol state"
  cisco.iosxr.iosxr_command:
    commands:
      - show route summary
      - show ospf neighbor
      - show bgp summary
  register: iosxr_routing

- name: "DEBUG | Routing state raw"
  ansible.builtin.debug:
    var: iosxr_routing.stdout

- name: "SET | Routing protocol summaries"
  ansible.builtin.set_fact:
    iosxr_route_summary: "{{ iosxr_routing.stdout[0] | default('show route summary: no output returned') | regex_replace('\r', '') }}"
    iosxr_ospf_neighbors: "{{ iosxr_routing.stdout[1] | default('show ospf neighbor: no output returned') | regex_replace('\r', '') }}"
    iosxr_bgp_summary: "{{ iosxr_routing.stdout[2] | default('show bgp summary: no output returned') | regex_replace('\r', '') }}"