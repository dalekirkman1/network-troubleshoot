---
# ============================================================
# SECTION 6: INTERFACE STATUS
#
# WHY: Brief interface summaries ('show ipv4 interface brief',
#      'show ipv6 interface brief', 'show interfaces brief')
#      give a one-line view per interface (state, protocol,
#      address). This is the fastest way to spot down / admin-
#      down links and misaddressing on IOS XR.
#
# HOW:
#   - Collects three standard summaries for v4, v6, and overall.
#   - Each stdout is normalised in Jinja2 by:
#       1. '.splitlines()' to create a list of lines.
#       2. '| map(''trim'')' to remove XR's column padding.
#       3. '| reject(''equalto'', '''')' to drop blank rows.
#       4. '| join('\n')' so the report shows a clean table
#          per view rather than a Python list representation.
#
# Tags: health, interfaces — run alone with: --tags health,interfaces
# ============================================================

- name: "6. Interface status"
  cisco.iosxr.iosxr_command:
    commands:
      - show ipv4 interface brief
      - show ipv6 interface brief
      - show interfaces brief
  register: iosxr_interface_status

- name: "DEBUG | Interface status raw"
  ansible.builtin.debug:
    var: iosxr_interface_status.stdout

- name: "SET | Interface status strings"
  ansible.builtin.set_fact:
    iosxr_int_ipv4_brief: "{{ iosxr_interface_status.stdout[0] | default('show ipv4 interface brief: no output returned') | regex_replace('\r', '') }}"
    iosxr_int_ipv6_brief: "{{ iosxr_interface_status.stdout[1] | default('show ipv6 interface brief: no output returned') | regex_replace('\r', '') }}"
    iosxr_int_brief_all: "{{ iosxr_interface_status.stdout[2] | default('show interfaces brief: no output returned') | regex_replace('\r', '') }}"