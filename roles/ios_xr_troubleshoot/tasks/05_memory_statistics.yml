---
# ============================================================
# SECTION 5: MEMORY STATISTICS
#
# WHY: Memory pressure on IOS XR shows up both in global pools
#      ('show memory summary') and per-process heaps ('show
#      processes memory'). Tracking the top 5 consumers helps
#      you spot leaks or oversized control-plane services.
#
# HOW:
#   - Runs:
#       * 'show memory summary' for system-wide pool usage.
#       * 'show processes memory' for per-process consumption.
#   - For the top 5:
#       1. '.splitlines()' turns stdout into a list.
#       2. The header containing 'JID'/'Process' is located.
#       3. A slice of header + next 5 lines is taken.
#       4. '| map(''trim'') | reject(''equalto'', '''')' cleans
#          up padding and blank rows.
#       5. '| join('\n')' produces a compact top-5 table.
#
# Tags: health, memory — run alone with: --tags health,memory
# ============================================================

- name: "5. Memory statistics"
  cisco.iosxr.iosxr_command:
    commands:
      - show memory summary
      - show processes memory
  register: iosxr_memory_stats

- name: "SET | Memory statistics summaries"
  ansible.builtin.set_fact:
    iosxr_memory_summary: >-
      {{ iosxr_memory_stats.stdout[0] | default('show memory summary: no output returned') | regex_replace('\r', '') }}
    iosxr_memory_top5: >-
      {% set lines = (iosxr_memory_stats.stdout[1] | default('show processes memory: no output returned') | regex_replace('\r', '')).split('\n') %}
      {% set header = (lines | select('search', 'JID') | list | first | default('')) %}
      {% set header_index = lines.index(header) if header else 0 %}
      {{ lines[header_index:header_index+6] | join('\n') }}