---
- name: "5. Memory statistics"
  cisco.iosxr.iosxr_command:
    commands:
      - show memory summary
      - show processes memory
  register: iosxr_memory_stats

- name: "SET | Memory statistics summaries"
  ansible.builtin.set_fact:
    iosxr_memory_summary: >-
      {{ iosxr_memory_stats.stdout[0] | default('show memory summary: no output returned') | regex_replace('\r', '') }}
    iosxr_memory_top5: >-
      {% set lines = (iosxr_memory_stats.stdout[1] | default('show processes memory: no output returned') | regex_replace('\r', '')).split('\n') %}
      {% set header = (lines | select('search', 'JID') | list | first | default('')) %}
      {% set header_index = lines.index(header) if header else 0 %}
      {{ lines[header_index:header_index+6] | join('\n') }}