---
- name: "4. CPU top processes"
  cisco.iosxr.iosxr_command:
    commands:
      - show processes cpu | include PID|High|Medium|Low
  register: iosxr_cpu_top

- name: "DEBUG | CPU top processes raw"
  ansible.builtin.debug:
    var: iosxr_cpu_top.stdout

- name: "SET | CPU top processes string"
  ansible.builtin.set_fact:
    iosxr_cpu_top_str: >-
      {{ (iosxr_cpu_top.stdout[0] | default('CPU process detail not available.') | regex_replace('\r', '')).split('\n')[0:25] | join('\n') }}