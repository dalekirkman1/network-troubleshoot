---
- name: "4. CPU top processes"
  cisco.iosxr.iosxr_command:
    commands:
      - show processes cpu
  register: iosxr_cpu_top

- name: "SET | CPU top 5 string"
  ansible.builtin.set_fact:
    iosxr_cpu_top_str: >-
      {# raw output split into lines #}
      {% set lines = (iosxr_cpu_top.stdout[0] | default('show processes cpu: no output returned') | regex_replace('\r', '')).split('\n') %}
      {# find header line (contains 'PID' and 'Process') #}
      {% set header = (lines | select('search', 'PID') | list | first | default('')) %}
      {% set header_index = lines.index(header) if header else 0 %}
      {# take header + next 5 lines #}
      {{ lines[header_index:header_index+6] | join('\n') }}