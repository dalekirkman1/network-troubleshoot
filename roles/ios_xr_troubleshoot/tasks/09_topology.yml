---
# ============================================================
# SECTION 9: TOPOLOGY (ARP / NDP / LLDP)
#
# WHY: Neighbor tables (ARP, IPv6 NDP, LLDP) give the live L2/L3
#      adjacency view. On IOS XR they are essential for verifying
#      reachability, duplicate addresses, or cabling mistakes.
#
# HOW:
#   - Runs:
#       * 'show arp'
#       * 'show ipv6 neighbors'
#       * 'show lldp neighbors'
#   - Each output is normalised in Jinja2:
#       1. '.splitlines()' to list form.
#       2. '| map(''trim'')' to strip padding.
#       3. '| reject(''equalto'', '''')' to drop empty lines.
#       4. '| join('\n')' for a clean table per command.
#
# Tags: topology, neighbors — run alone with: --tags topology
# ============================================================

- name: "9. Topology and neighbor data"
  cisco.iosxr.iosxr_command:
    commands:
      - show arp
      - show ipv6 neighbors
      - show lldp neighbors
  register: iosxr_topology

- name: "DEBUG | Topology raw"
  ansible.builtin.debug:
    var: iosxr_topology.stdout

- name: "SET | Topology summary"
  ansible.builtin.set_fact:
    iosxr_arp_table: "{{ iosxr_topology.stdout[0] | default('show arp: no output returned') | regex_replace('\r', '') }}"
    iosxr_nd_table: "{{ iosxr_topology.stdout[1] | default('show ipv6 neighbors: no output returned') | regex_replace('\r', '') }}"
    iosxr_lldp_neighbors: "{{ iosxr_topology.stdout[2] | default('show lldp neighbors: no output returned') | regex_replace('\r', '') }}"