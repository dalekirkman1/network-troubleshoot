---
# ============================================================
# SECTION 3: PLATFORM HEALTH STATUS
#
# WHY: On IOS XR, 'admin show environment all' and 'show platform'
#      give chassis-level health (power, fan, temperature, card
#      state). This surfaces systemic hardware issues that are
#      independent of any one protocol or interface.
#
# HOW:
#   - Collects:
#       * 'admin show environment all' for sensors and PSU/fan
#         state in the admin plane.
#       * 'show platform' for line card and RP status.
#   - The raw stdout strings are processed in Jinja2:
#       1. '.splitlines()' converts multi-line output to lists.
#       2. '| map(''trim'')' removes padding from each line.
#       3. '| reject(''equalto'', '''')' drops blank lines for
#          compact tables in debug and the report.
#       4. '| list' materialises the filtered output.
#       5. '| join('\n')' rejoins the list into a readable block
#          instead of a Python list literal.
#
# Tags: health — run alone with: --tags health
# ============================================================

- name: "3. Platform health (environment & platform)"
  cisco.iosxr.iosxr_command:
    commands:
      - admin show environment all
      - show platform
  register: iosxr_platform_health

- name: "DEBUG | Platform health (environment & platform)"
  ansible.builtin.debug:
    msg:
      - "Environment (first 30 lines):"
      - "{{ (iosxr_platform_health.stdout[0] | default('N/A') | regex_replace('\r', '')).split('\n')[0:30] | join('\n') }}"
      - ""
      - "Platform (first 30 lines):"
      - "{{ (iosxr_platform_health.stdout[1] | default('N/A') | regex_replace('\r', '')).split('\n')[0:30] | join('\n') }}"

- name: "SET | Environment & platform summaries"
  ansible.builtin.set_fact:
    iosxr_env_overview: >-
      {{ (iosxr_platform_health.stdout[0] | default('Environment information not available.') | regex_replace('\r', '')).split('\n')[0:80] | join('\n') }}
    iosxr_platform_overview: >-
      {{ (iosxr_platform_health.stdout[1] | default('show platform: no output returned') | regex_replace('\r', '')).split('\n')[0:80] | join('\n') }}