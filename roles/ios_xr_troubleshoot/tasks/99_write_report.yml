---
# ============================================================
# SECTION 99: REPORT ASSEMBLY AND WRITE-OUT
#
# WHY: Gathers all previously collected IOS XR health data and
#      writes a single, timestamped text report per device on
#      the Ansible control node. This provides a durable,
#      offline artefact you can attach to tickets or compare
#      between runs.
#
# HOW:
#   - Creates a local reports directory (default ./reports/ios_xr/)
#     on the control node.
#   - Uses 'set_fact' to build a large Jinja2 multi-line string
#     (iosxr_report_content) composed of all section outputs.
#   - The report uses safe defaults ('| default(...)') for every
#     section so missing or failed commands don't break report
#     generation.
#   - 'copy' with 'delegate_to: localhost' writes the report to
#     the control node with a hostname + timestamped filename.
#
# Tags: report — run alone with: --tags report
# ============================================================

- name: "REPORT | Set timestamp and report directory for IOS XR report"
  ansible.builtin.set_fact:
    report_ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    report_dir_ios_xr: "{{ report_dir_ios_xr | default('./reports/ios_xr/') }}"
  delegate_to: localhost
  tags: report

- name: "REPORT | Ensure local IOS XR report directory exists"
  ansible.builtin.file:
    path: "{{ report_dir_ios_xr }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  tags: report

- name: "REPORT | Build IOS XR health report content"
  ansible.builtin.set_fact:
    iosxr_report_content: |
      =======================================================
      IOS XR HEALTH REPORT: {{ iosxr_hostname | default(inventory_hostname) }}
      DATE: {{ report_ts }}
      =======================================================



      --- 1. SYSTEM INFO ---
      {{ iosxr_system_info.stdout[0] | default('show version: no output returned', true) }}



      --- 2. DEVICE UPTIME ---
      {{ iosxr_uptime_line | default('Uptime: see full show version output') }}



      --- 3. PLATFORM HEALTH (ENV / PLATFORM) ---
      Environment:
      {{ iosxr_env_overview | default('Environment information not available') }}

      Platform:
      {{ iosxr_platform_overview | default('Platform overview not available') }}



      --- 4. CPU TOP PROCESSES ---
      {{ iosxr_cpu_top_str | default('Top CPU processes not available') }}



      --- 5. MEMORY STATISTICS ---
      Summary:
      {{ iosxr_memory_summary | default('show memory summary: no output returned') }}

      Top 5 processes by memory:
      {{ iosxr_memory_top5 | default('show processes memory: no output returned') }}



      --- 6. INTERFACE STATUS ---
      IPv4 brief:
      {{ iosxr_int_ipv4_brief | default('show ipv4 interface brief: no output returned') }}

      IPv6 brief:
      {{ iosxr_int_ipv6_brief | default('show ipv6 interface brief: no output returned') }}

      Interface brief:
      {{ iosxr_int_brief_all | default('show interfaces brief: no output returned') }}



      --- 7. INTERFACE HEALTH ---
      {{ iosxr_int_health_str | default('show interfaces: no output returned') }}



      --- 8. TRANSCEIVER / OPTICS DIAGNOSTICS ---
      {{ iosxr_transceiver_str | default('Transceiver / optics diagnostics not available') }}



      --- 9. TOPOLOGY (ARP / NDP / LLDP) ---
      ARP:
      {{ iosxr_arp_table | default('show arp: no output returned') }}

      IPv6 neighbors:
      {{ iosxr_nd_table | default('show ipv6 neighbors: no output returned') }}

      LLDP neighbors:
      {{ iosxr_lldp_neighbors | default('show lldp neighbors: no output returned') }}



      --- 10. ROUTING STATE ---
      Route summary:
      {{ iosxr_route_summary | default('show route summary: no output returned') }}

      OSPF neighbors:
      {{ iosxr_ospf_neighbors | default('show ospf neighbor: no output returned') }}

      BGP summary:
      {{ iosxr_bgp_summary | default('show bgp summary: no output returned') }}



      --- 11. FLOW / FORWARDING STATE ---
      IPv4 traffic:
      {{ iosxr_ipv4_traffic | default('show ipv4 traffic: no output returned') }}

      IPv6 traffic:
      {{ iosxr_ipv6_traffic | default('show ipv6 traffic: no output returned') }}

      CEF summary:
      {{ iosxr_cef_summary | default('show cef summary: no output returned') }}



      --- 12. RECENT LOGS ---
      {{ iosxr_logs_text | default('show logging: no output returned') }}



      --- 13. ALARMS AND FAULTS ---
      {{ iosxr_alarms_brief | default('Alarms not available or command unsupported on this platform.') }}



      --- 14. CONTROL-PLANE / LPTS POLICERS ---
      {{ iosxr_lpts_summary | default('LPTS punt policer statistics are not available or not applicable on this XRv platform.') }}



      --- 15. QOS / POLICY-MAP (Gi0/0/0/0) ---
      {{ iosxr_qos_summary | default('QoS / policy-map information not available or not applied on GigabitEthernet0/0/0/0.') }}



      --- 16. BUNDLE / LACP STATUS ---
      {{ iosxr_bundle_summary | default('No bundle interfaces or LACP status available on this platform.') }}

  tags: report

- name: "REPORT | Write IOS XR health report to control node"
  ansible.builtin.copy:
    content: "{{ iosxr_report_content }}"
    dest: "{{ report_dir_ios_xr }}{{ iosxr_hostname | default(inventory_hostname) }}_iosxr_health_report_{{ report_ts }}.txt"
    mode: "0644"
  delegate_to: localhost
  tags: report

- name: "REPORT | Confirm IOS XR health report file path to console"
  ansible.builtin.debug:
    msg: "IOS XR health report saved → {{ report_dir_ios_xr }}{{ iosxr_hostname | default(inventory_hostname) }}_iosxr_health_report_{{ report_ts }}.txt"
  tags: report