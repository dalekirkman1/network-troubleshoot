[defaults]
inventory           = inventory/production/hosts.yml
roles_path          = roles
collections_path    = ~/.ansible/collections
host_key_checking   = False
stdout_callback     = ansible.builtin.default
timeout             = 30

[callback_default]
result_format       = yaml
show_per_host_start = true

[persistent_connection]
connect_timeout     = 30
command_timeout     = 30